name: Build Resume From JSON

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Python Dependencies
        run: pip install jinja2

      - name: Generate LaTeX Files
        run: python3 scripts/generate_resume_from_json.py

      - name: Compile Software Resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: generated/software.tex
          latexmk_use_xelatex: true

      - name: Compile Robotics Resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: generated/robotics.tex
          latexmk_use_xelatex: true

      - name: Compile Architect Resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: generated/architect.tex
          latexmk_use_xelatex: true

      - name: Compile Management Resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: generated/management.tex
          latexmk_use_xelatex: true

      - name: Create PDF Directory
        run: mkdir -p docs/pdfs

      - name: Debug Generated Files
        run: |
          echo "===== GENERATED ====="
          find generated -type f || true

          echo ""
          echo "===== ALL PDFS ====="
          find . -name "*.pdf" || true

      - name: Publish PDFs To GitHub Pages
        run: cp generated/*.pdf docs/pdfs/

      - name: Commit Updated PDFs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update generated resume PDFs
          file_pattern: docs/pdfs/*.pdf

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: generated/*.pdf
