name: Build Resume PDF

on:
  workflow_dispatch:
    inputs:
      pdf_name:
        description: PDF file name (without .pdf)
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate PDF name
        env:
          PDF_NAME: ${{ inputs.pdf_name }}
        run: |
          if [[ ! "$PDF_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,79}$ ]]; then
            echo "Invalid PDF name" >&2
            exit 1
          fi

      - name: Compile resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: tex/modifiable-about.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: true

      - name: Publish and archive resume
        env:
          PDF_NAME: ${{ inputs.pdf_name }}
        run: |
          mkdir -p docs/pdfs "output/${PDF_NAME}"
          cp tex/modifiable-about.pdf "output/${PDF_NAME}/${PDF_NAME}.pdf"
          cp tex/modifiable-about.tex "output/${PDF_NAME}/${PDF_NAME}.tex"
          cp "output/${PDF_NAME}/${PDF_NAME}.pdf" "docs/pdfs/${PDF_NAME}.pdf"

      - name: Commit resume files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update resume PDF and source
          file_pattern: docs/pdfs/*.pdf output/*/*.pdf output/*/*.tex

      - name: Upload resume artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-${{ inputs.pdf_name }}
          path: output/${{ inputs.pdf_name }}/
