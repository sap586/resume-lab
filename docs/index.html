<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resume Lab</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <header>
            <h1>Resume Lab</h1>
        </header>
        <form id="resumeForm">
            <label for="about">About</label>
            <textarea id="about" rows="7" required aria-describedby="status"></textarea>

            <label for="pdfName">PDF file name</label>
            <div class="filename">
                <input id="pdfName" type="text" placeholder="my-resume" required maxlength="84" autocomplete="off">
                <span>.pdf</span>
            </div>

            <details>
                <summary>GitHub access</summary>
                <label for="githubToken">Personal access token</label>
                <input id="githubToken" type="password" autocomplete="off" placeholder="Token with Contents and Actions write access">
            </details>

            <button id="compileButton" type="submit" disabled>Compile PDF</button>
            <p id="status" role="status" aria-live="polite">Loading current About...</p>
        </form>

        <section id="pdf-downloads" aria-labelledby="pdf-downloads-heading">
            <h2 id="pdf-downloads-heading">Download available PDFs</h2>
            <p>Select one or more files. Your browser may ask you to allow multiple downloads.</p>
            <label class="select-all" for="selectAllPdfs">
                <input id="selectAllPdfs" type="checkbox" disabled>
                Select all
            </label>
            <div id="pdfList" class="pdf-list" role="group" aria-label="Available PDF files">
                Loading available PDFs...
            </div>
            <button id="downloadSelected" type="button" disabled>Download selected</button>
            <p id="downloadStatus" role="status" aria-live="polite"></p>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
